server {
    listen 80;
    server_name lab1.chiyeuminhem.id.vn localhost;

    location / {
        root /usr/share/nginx/html/lab1;
        index index.html;
    }

    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}