<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1 - Lê Đỗ Hoàng Thiện</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1>Bài tập Lab 1 - Sinh viên: Lê Đỗ Hoàng Thiện</h1>
    <p>Domain: <strong>lab1.chiyeuminhem.id.vn</strong></p>
    
    <h2>Danh sách Tắc kè (Dữ liệu từ API Node-RED)</h2>
    <table id="tackeTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên loài</th>
                <th>Trạng thái</th>
                <th>Khu vực</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="4">Đang tải dữ liệu...</td></tr>
        </tbody>
    </table>

    <script>
        fetch('/api/tacke')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('#tackeTable tbody');
                tbody.innerHTML = '';
                data.forEach(item => {
                    const row = `<tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.status}</td>
                        <td>${item.location}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Lỗi gọi API:', error);
                document.querySelector('#tackeTable tbody').innerHTML = '<tr><td colspan="4" style="color:red;">Không thể kết nối API!</td></tr>';
            });
    </script>
</body>
</html>
